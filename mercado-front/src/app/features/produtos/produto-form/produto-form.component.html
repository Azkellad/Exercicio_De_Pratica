<form class="form" (ngSubmit)="onSalvar()">
  <div class="form__row">
    <label for="nome">Nome do produto</label>
    <input id="nome" name="nome" type="text" [(ngModel)]="nome" placeholder="Ex.: Arroz branco 5kg" required autocomplete="off" />
  </div>

  <div class="form__row">
    <label for="descricao">Descrição</label>
    <textarea id="descricao" name="descricao" rows="2" [(ngModel)]="descricao" placeholder="Detalhes, marca, unidade de venda..."></textarea>
  </div>

  <div class="form__row form__row--curto">
    <label for="quantidade">Quantidade em estoque</label>
    <input id="quantidade" name="quantidade" type="number" min="0" [(ngModel)]="quantidade" required />
  </div>

  <div class="form__acoes">
    <button type="button" class="btn btn-ghost" (click)="cancelar.emit()">Cancelar</button>
    <button type="submit" class="btn btn-primary" [disabled]="!valido">
      {{ editando ? 'Salvar alterações' : 'Cadastrar produto' }}
    </button>
  </div>
</form>
