<div class="shell">
  <aside class="rail">
    <div class="rail-brand">
      <svg class="rail-brand__mark" viewBox="0 0 40 40" fill="none" aria-hidden="true">
        <path d="M6 14 L20 6 L34 14 L34 32 L6 32 Z" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round" />
        <path d="M6 14 L20 22 L34 14" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round" />
        <path d="M20 22 L20 32" stroke="currentColor" stroke-width="2.5" />
      </svg>
      <span class="rail-brand__word">Mercado</span>
    </div>

    <nav class="rail-nav">
      <a routerLink="/compra" routerLinkActive="is-active" class="rail-nav__item">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M4 5h16v14H4zM8 9h8M8 13h5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <span>Compra</span>
      </a>
      <a routerLink="/produtos" routerLinkActive="is-active" class="rail-nav__item">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M3 8h18M5 8l1.4 11.2a1.5 1.5 0 0 0 1.49 1.3h8.22a1.5 1.5 0 0 0 1.49-1.3L19 8M9 8V6a3 3 0 0 1 6 0v2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <span>Produtos</span>
      </a>
      <a routerLink="/notas" routerLinkActive="is-active" class="rail-nav__item">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M5 3.5h14v16.6l-2.3-1.4-2.3 1.4-2.4-1.4-2.4 1.4-2.3-1.4-2.3 1.4V3.5Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" />
          <path d="M8 8.2h8M8 11.8h8M8 15.4h5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
        </svg>
        <span>Notas</span>
      </a>
    </nav>

    <div class="rail-foot">{{ hoje }}</div>
  </aside>

  <main class="stage">
    <router-outlet></router-outlet>
  </main>

  <nav class="tabbar">
    <a routerLink="/compra" routerLinkActive="is-active" class="tabbar__item">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M4 5h16v14H4zM8 9h8M8 13h5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
      Compra
    </a>
    <a routerLink="/produtos" routerLinkActive="is-active" class="tabbar__item">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M3 8h18M5 8l1.4 11.2a1.5 1.5 0 0 0 1.49 1.3h8.22a1.5 1.5 0 0 0 1.49-1.3L19 8M9 8V6a3 3 0 0 1 6 0v2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
      Produtos
    </a>
    <a routerLink="/notas" routerLinkActive="is-active" class="tabbar__item">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M5 3.5h14v16.6l-2.3-1.4-2.3 1.4-2.4-1.4-2.4 1.4-2.3-1.4-2.3 1.4V3.5Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" />
        <path d="M8 8.2h8M8 11.8h8M8 15.4h5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
      </svg>
      Notas
    </a>
  </nav>

  <app-toast></app-toast>
</div>
